[project]
name = "karofi"
version = "1.1.1"
description = "Home Assistant integration for Karofi Water Purifier"
requires-python = ">=3.14.2"
dependencies = ["homeassistant>=2026.10.0"]

[dependency-groups]
dev = [
  "aiousbwatcher",
  "bleak",
  "bleak-retry-connector",
  "interrogate",
  "orjson",
  "packaging",
  "prek",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-homeassistant-custom-component",
  "pytest-timeout",
  "pytest-xdist",
  "ruff",
  "serialx",
  "tomlkit",
  "ty",
]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "G",   # flake8-logging-format
  "I",   # isort
  "LOG", # flake8-logging
  "N",   # pep8-naming
  "PIE", # flake8-pie
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "-n",
  "auto",
  "--quiet",
  "--cov=custom_components",
  "--cov-fail-under=90",
  "--cov-branch",
  "--timeout=90",
  "--strict-markers",
]

[tool.pyright]
typeCheckingMode = "standard"
reportUnreachable = "warning"
exclude = ["scratch"]

[tool.interrogate]
fail-under = 100
ignore-nested-functions = true
exclude = ["scratch"]
